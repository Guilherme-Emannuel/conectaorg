services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # HOST_PORT (porta do servidor) e PORT (porta que o app escuta
      # dentro do container) são variáveis separadas de propósito — mudar
      # uma não deve descasar da outra.
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      # organograma.json real fica só no host, nunca dentro da imagem
      - ./data:/app/data
