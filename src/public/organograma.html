<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organograma — ConectaOrg</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/organograma.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="container org-container">
        <div class="org-toolbar" id="org-toolbar"></div>

        <div class="org-viewport" id="org-viewport">
          <div class="org-canvas" id="org-canvas"></div>
          <div class="zoom-controls" id="zoom-controls"></div>
        </div>

        <div class="org-list" id="org-list" style="display:none"></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>initLayout('organograma');</script>
  <script src="/js/organograma.js"></script>
</body>
</html>
