<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários — ConectaOrg</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="container">
        <div class="card">
          <h3>Usuários</h3>
          <p class="muted">
            Dados consultados em modo somente leitura de um banco externo.
            Nenhuma informação pode ser alterada por esta tela.
          </p>
        </div>

        <div id="aviso" class="card" style="display:none">
          <p class="muted" id="aviso-texto"></p>
        </div>

        <div class="card" id="dados-card" style="display:none">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
            <input type="search" id="filtro" class="search-input"
              placeholder="Buscar em todos os registros...">
            <span class="muted" id="contagem" style="font-size:12.5px"></span>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead id="cabecalho"></thead>
              <tbody id="linhas"></tbody>
            </table>
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap">
            <button class="btn-sm" id="pag-anterior">« Anterior</button>
            <span class="muted" id="pag-info" style="font-size:12.5px"></span>
            <button class="btn-sm" id="pag-proxima">Próxima »</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    initLayout('usuarios');

    function esc(texto) {
      const div = document.createElement('div');
      div.textContent = texto ?? '';
      return div.innerHTML;
    }

    // busca e paginação acontecem no SERVIDOR — aqui só exibimos
    let paginaAtual = 1;
    let termoBusca = '';
    let totalPaginas = 1;

    function renderizar(dados) {
      document.getElementById('cabecalho').innerHTML =
        `<tr>${dados.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr>`;

      document.getElementById('linhas').innerHTML =
        dados.rows
          .map(
            (linha) =>
              `<tr>${dados.columns.map((c) => `<td>${esc(linha[c])}</td>`).join('')}</tr>`
          )
          .join('') ||
        `<tr><td colspan="${Math.max(1, dados.columns.length)}" class="muted">Nenhum resultado.</td></tr>`;

      document.getElementById('contagem').textContent =
        `${dados.total.toLocaleString('pt-BR')} registro(s)` +
        (termoBusca ? ` para "${termoBusca}"` : '');

      totalPaginas = dados.totalPages;
      document.getElementById('pag-info').textContent =
        `Página ${dados.page} de ${dados.totalPages}`;
      document.getElementById('pag-anterior').disabled = dados.page <= 1;
      document.getElementById('pag-proxima').disabled = dados.page >= dados.totalPages;
    }

    async function carregar() {
      const params = new URLSearchParams({ page: paginaAtual });
      if (termoBusca) params.set('q', termoBusca);

      const res = await apiFetch(`/api/external-users?${params}`);
      if (!res) return;

      if (!res.ok) {
        const { error } = await res.json().catch(() => ({}));
        const aviso = document.getElementById('aviso');
        document.getElementById('aviso-texto').textContent =
          error || 'Erro ao consultar os dados.';
        aviso.style.display = 'block';
        return;
      }

      document.getElementById('dados-card').style.display = 'block';
      renderizar(await res.json());
    }

    // busca com espera de digitação (350ms) — cada busca consulta o banco todo
    let buscaTimer = null;
    document.getElementById('filtro').addEventListener('input', (e) => {
      clearTimeout(buscaTimer);
      buscaTimer = setTimeout(() => {
        termoBusca = e.target.value.trim();
        paginaAtual = 1;
        carregar();
      }, 350);
    });

    document.getElementById('pag-anterior').addEventListener('click', () => {
      if (paginaAtual > 1) {
        paginaAtual--;
        carregar();
      }
    });

    document.getElementById('pag-proxima').addEventListener('click', () => {
      if (paginaAtual < totalPaginas) {
        paginaAtual++;
        carregar();
      }
    });

    carregar();
  </script>
</body>
</html>
